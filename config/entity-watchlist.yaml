# Entity Watchlist — declarative tracking config
#
# Replaces "Karpathy skill / Musk skill / Trump skill" with declarative
# entity entries.  Each entity is composed from existing connectors;
# no new domain skill required.
#
# Use:
#   python3 scripts/follow_entity.py karpathy
#   python3 scripts/follow_entity.py musk --sources rss,edgar,hn
#
# Schema:
#   <entity_id>:
#     display: "Human-readable name"
#     kind: person | company | institution | topic
#     sources:
#       rss: [list of feed URLs]
#       bluesky_handle: <handle>
#       hn_query: <hackernews search term>
#       reddit_query: <reddit search term>
#       gdelt_query: <gdelt search term>
#       openalex_query: <author/affiliation search>
#       hf_query: <HF Daily Papers filter>
#       edgar_tickers: [SEC tickers]
#       truth_social_handle: <handle>
#       mastodon_tag: <hashtag without #>
#       tavily_query: "<free-text web search>"
#     primary_domain: ai_progress | enterprise | us_policy | ...  (for routing)

version: 1

people:

  karpathy:
    display: "Andrej Karpathy"
    kind: person
    primary_domain: ai_progress
    sources:
      rss: ["https://karpathy.github.io/feed.xml"]
      bluesky_handle: "karpathy.bsky.social"
      hn_query: "karpathy"
      reddit_query: "Karpathy"
      gdelt_query: "Andrej Karpathy"
      openalex_query: "Karpathy"
      hf_query: "Karpathy"
      tavily_query: "Andrej Karpathy latest"

